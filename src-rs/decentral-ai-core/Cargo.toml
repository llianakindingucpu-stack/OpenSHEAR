[package]
name = "decentral-ai-core"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tower = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
ureq = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
safetensors = "0.7"
anyhow = "1"
ndarray = { version = "0.16", default-features = false, features = ["std"] }
rand = "0.8"
byteorder = "1"

[[bin]]
name = "decentral-ai-core"
path = "src/main.rs"

[[bin]]
name = "router"
path = "src/router_main.rs"

[[bin]]
name = "shear"
path = "src/shear_main.rs"
